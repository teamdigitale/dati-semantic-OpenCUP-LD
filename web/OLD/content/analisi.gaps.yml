title: Come leggere questi numeri
items:
  - >
    I **grafici e la mappa** di questa pagina usano i dati **di tutta Italia**
    (milioni di progetti e gare). L’[Unione semantica](/unione) invece mostra un
    **campione** di progetti dove OpenCUP, ANAC, PA Digitale e SCP si incontrano:
    lì conti meno, ma vedi *come* sono collegati.
  - >
    Nei dati ANAC compare a volte il codice **ND**: non è un progetto reale, significa
    «CUP non dichiarato». Lo abbiamo **escluso** dalle classifiche «CUP con più CIG».
  - >
    Le **aggiudicazioni SCP** (chi ha vinto le gare) sono nei grafici a scala nazionale;
    nel grafo hub compaiono solo per i lotti del campione interop.
  - >
    La voce **«soggetto privato»** tra i titolari OpenCUP non è un’azienda unica: è
    un’etichetta generica quando il nome del privato non è pubblicato.
  - >
    **Ancora in arrivo:** mappe sul finanziamento digitale PA Digitale per comune,
    confronti Wikidata per arricchimenti futuri.
