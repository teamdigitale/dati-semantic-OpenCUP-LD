sources:
  - title: OpenCUP
    description: Anagrafica CUP, costi, classificazione, titolare (CF)
  - title: ANAC CUP↔CIG
    description: Lotti di gara collegati al CUP
  - title: PA Digitale
    description: Avvisi PNRR e finanziamenti
  - title: IndicePA
    description: Ente con codice IPA e owl:sameAs verso il CF
