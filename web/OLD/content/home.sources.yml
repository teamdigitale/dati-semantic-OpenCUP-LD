    description: Bandi ed esiti (aggiudicatari) sullo stesso CIG
sources_note: >
  Le [Analisi](/analisi) usano già le basi complete (territorio, stati, aggiudicazioni).
  Il RDF e le mappe a grafo restano sull'hub interop (PA Digitale ∩ ANAC ∩ esiti) e su un campione di CUP.
