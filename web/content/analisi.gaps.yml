title: Come leggere questi numeri
items:
  - >
    I **grafici e la mappa** usano i dati di tutta Italia (milioni di progetti e gare).
    L’[Unione semantica](/unione) mostra invece alcuni progetti in cui OpenCUP, ANAC,
    PA Digitale e gli esiti di gara si incontrano: lì i conteggi sono minori, ma è visibile *come* siano collegati.
  - >
    Nei dati ANAC compare a volte il codice **ND**: non è un progetto reale, significa
    «CUP non dichiarato». È escluso dalle classifiche «CUP con più CIG».
  - >
    La voce **«soggetto privato»** tra i titolari OpenCUP non è un’azienda unica: è
    un’etichetta generica quando il nome del privato non è pubblicato.
