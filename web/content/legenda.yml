aria: Legenda colori grafo
title: Legenda

colors:
  title: Colori dei nodi — provenienza
  hint: >
    Ogni nodo è colorato in base alla fonte. Lo stesso CUP può comparire
    in più banche dati con lo **stesso URI**: il colore indica
    da dove arrivano le informazioni che arricchiscono quel nodo.

datasets:
  opencup: Progetto CUP, intervento e soggetto titolare — anagrafica OpenCUP
  candidature: Avviso PNRR e importi — candidature PA Digitale finanziate
  cupcig: Lotto di gara (CIG) collegato al CUP — dati ANAC
  enti_ipa: Ente da IndicePA (codice IPA), collegato al codice fiscale del titolare
  shared: Letterale o risorsa senza dataset di provenienza

join_nodes:
  title: Nodi con alone rosso — punti di incontro
  hint: >
    Nodi che collegano più fonti: il colore indica la provenienza;
    l’alone rosso segnala il ruolo di ancoraggio.
  label: Nodo condiviso
  desc: CUP, soggetto titolare, lotto CIG, avviso PNRR, …

join_edges:
  title: Archi rossi — collegamenti tra fonti
  hint: >
    Relazioni esplicite: stesso URI, collegamento ente↔codice fiscale,
    oppure proprietà dell’ontologia (lotto → progetto, progetto → avviso).
  label: Collegamento
  desc: avviso PNRR, titolare, ente IndicePA, lotto → progetto
