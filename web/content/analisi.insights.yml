opencup_by_stato: >
  Quanti progetti pubblici sono ancora **attivi** e quanti risultano **chiusi**
  (anche d’ufficio). È una fotografia dello stato di avanzamento OpenCUP a scala nazionale.

cups_by_regione: >
  Dove si concentrano i CUP OpenCUP in **valore assoluto**.
  Sotto si confrontano anche a parità di popolazione e di PIL.

cups_by_regione_per_100k: >
  Stessi CUP, divisi per abitanti (ISTAT): **CUP ogni 100.000 residenti**.

cups_by_regione_per_pil: >
  Intensità rispetto all’economia regionale: **CUP per miliardo di euro di PIL**
  (PIL stimato da popolazione × PIL pro capite ISTAT).

cups_by_regione_map: >
  Mappa interattiva: si possono selezionare **CUP o CIG**, **quantità o importo €**, e il livello
  (regioni / province / comuni; con **Auto** il livello cambia allo zoom).
  A livello regione restano le scale per abitante e per PIL.

pad_cost_by_regione: >
  Finanziamenti assegnati nell’ambito dei fondi PNRR di PA Digitale, per regione.

pad_top_comuni: >
  Comuni che hanno ottenuto di più sugli avvisi PA Digitale.

scp_top_aggiudicatari: >
  A chi sono state aggiudicate più spesso le gare: soggetti con il maggior numero di lotti (CIG) negli esiti SCP,
  aggregati per codice fiscale, quando presente.

scp_top_aggiudicatari_euro: >
  Stessa fonte, classifica per somma degli importi di aggiudicazione.
  Si considerano solo lotti con importo dichiarato ≤ 10 M€ (per ridurre outlier noti nel dataset).

cups_by_settore: >
  A cosa servono i progetti: istruzione, infrastrutture, servizi…
  Nella semantica lo stesso settore è un concetto riusabile tra progetti, non solo una stringa in colonna.

cups_by_categoria: >
  Categorie più fini dello stesso albero di classificazione: utili per capire il mix degli interventi.

cup_cig_distribution: >
  Quanti lotti di gara (CIG) ha un progetto (CUP). I CUP placeholder (ND) sono esclusi.

top_cup_cig: >
  Top CUP per numero di CIG su tutta ANAC (esclusi placeholder **ND** / zeri).
  Nel tooltip è presente anche la **descrizione sintetica** OpenCUP del progetto.

cost_by_funder: >
  Chi gestisce i finanziamenti più grandi (titolare OpenCUP). Attenzione: la voce **«soggetto privato»**
  non è un ente singolo, ma un’etichetta generica/anonimizzata usata da OpenCUP quando il titolare
  è privato e il nome non è esposto (imprese, no-profit, ecc.).

soggetto_privato_by_categoria: >
  Scomposizione dei soli CUP con titolare «soggetto privato» per **categoria soggetto** OpenCUP.

cost_by_call: >
  Finanziamenti PA Digitale per avviso (cloud, esperienza del cittadino, pagoPA, notifiche, SPID/CIE…):
  quanto pesano le misure digitali PNRR.
