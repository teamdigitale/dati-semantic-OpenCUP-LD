sources:
  - title: OpenCUP
    description: Anagrafica dei progetti — CUP, costi, classificazione, soggetto titolare
  - title: ANAC CUP↔CIG
    description: Lotti di gara (CIG) collegati al Codice Unico di Progetto
  - title: PA Digitale
    description: Avvisi PNRR e finanziamenti per la digitalizzazione della PA
  - title: IndicePA
    description: Enti pubblici con codice IPA, collegati al codice fiscale del titolare
  - title: SCP MIT
    description: Bandi ed esiti di gara (aggiudicatari) sullo stesso CIG
sources_note: >
  Le [Analisi](/analisi) mostrano i numeri a scala nazionale.
  I [grafi](/grafi) e l’[unione](/unione) mostrano come le stesse entità si colleghino
  a partire dallo stesso CUP.
